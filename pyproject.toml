[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmri-study-check"
version = "0.1.0"
description = "A reproducible, descriptive fMRI integrity and motion sensitivity demonstration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nilearn>=0.12,<0.14",
  "nibabel>=5.3,<6",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "jinja2>=3.1,<4",
  "streamlit>=1.66,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "playwright>=1.49,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
